# The full pack bundle the app downloads (`app/src-tauri/src/pack.rs`, `BUNDLE`):
# projectM's cream-of-the-crop at a pinned commit, with the `index.json` and
# `thumbnails/` the `index` bin draws for it, as one tar.gz. See docs/pack.md,
# which also has the same steps to run on a Mac by hand.
#
# Slow and optional: building on a Mac (docs/pack.md, "On a Mac") is the
# supported path. A full run on GitHub's macOS runner spent over an hour drawing
# the presets without finishing. Use it for a sample run, or expect hours.
#
# Run it by hand (Actions → pack → Run workflow). By default it builds the whole
# bundle and keeps it as a build artifact. "publish" also uploads it to the
# release named by TAG below, creating that release if needed; the release is
# never marked latest, as the app's updater reads `releases/latest`. A sample
# run (for checking the runner draws) is never published.

name: pack

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Index only this many presets, spread over the pack (empty for all)
        type: string
        default: ''
      publish:
        description: Upload the bundle to the release (not with a sample)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pack
  cancel-in-progress: false

env:
  # A new bundle goes under a new tag; BUNDLE in pack.rs names it, with its size.
  TAG: pack-v1
  # The pack's presets; the same commit as PROJECTM in pack.rs.
  PROJECTM: https://github.com/projectM-visualizer/presets-cream-of-the-crop/archive/0180df21f5e0bd39b9060cc5de420ed2f1f9e509.tar.gz
  ASSET: cream-of-the-crop.tar.gz

jobs:
  bundle:
    # macOS for Metal: the index bin draws every preset on the GPU.
    runs-on: macos-26
    # About 20 minutes on an M1 Max with 8 jobs; the runner took over an hour
    # without finishing (run 37882595758, cancelled). The
    # index bin ends on its own if its children can't get a GPU.
    timeout-minutes: 300
    defaults:
      run:
        # Named, so a pipe fails with what it pipes (pipefail).
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: pack

      - run: cargo build --release -p visuals-engine --bin index

      - name: The presets
        run: |
          mkdir -p .tmp/pack/cream-of-the-crop
          curl -fsSL "$PROJECTM" | tar -xz -C .tmp/pack/cream-of-the-crop --strip-components 1
          find .tmp/pack/cream-of-the-crop -name '*.milk' | wc -l

      # The second run draws again only the presets the first skipped: timeouts
      # are mostly cold shader compiles queued behind each other.
      - name: Index and thumbnails
        env:
          SAMPLE: ${{ inputs.sample }}
        run: |
          index() { target/release/index .tmp/pack/cream-of-the-crop --out .tmp/pack/cream-of-the-crop --jobs "$(sysctl -n hw.ncpu)" ${SAMPLE:+--sample "$SAMPLE"} "$@"; }
          index
          index --retry | tee .tmp/pack/index.txt
          {
            echo '### Index'
            echo '```'
            cat .tmp/pack/index.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle
        run: |
          COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata -czf "$ASSET" -C .tmp/pack cream-of-the-crop
          echo "$ASSET: $(stat -f %z "$ASSET") bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: pack-${{ github.run_number }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish
        if: ${{ inputs.publish && inputs.sample == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --latest=false --title "Preset pack ($TAG)" --notes "The full preset library the app downloads: projectM's cream-of-the-crop with its index and thumbnails. See docs/pack.md."
          gh release upload "$TAG" "$ASSET" --clobber
