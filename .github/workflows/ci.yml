name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci` runs the postinstall, which compiles the Ableton Link addon
      # against this runner's toolchain (python3 and build-essential, both
      # present on ubuntu-latest) — see `tools/build-link.ts`.
      - run: npm ci

      # The stories project renders every story in headless Chromium.
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      # Coverage rather than a plain run: same tests, V8's own counters, and a
      # table on the build page instead of a number that only ever existed in
      # somebody's terminal.
      - id: coverage
        run: npm run test:coverage

      # report/ is the vitest ui with the coverage report copied in under
      # coverage/ — one directory that is both the artifact and the site.
      - if: ${{ !cancelled() && steps.coverage.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ github.sha }}
          path: report/
          if-no-files-found: error
          retention-days: 14

      # The "must build from a clean tree" rule, enforced rather than
      # remembered. A clean checkout is the only place it's honestly tested —
      # a file that's untracked but imported passes locally and fails here.
      - run: npm run build

      # The stories, built rather than only typechecked: a story that imports
      # something only the app's Vite config can resolve fails here and nowhere else.
      - run: npm run build:storybook

  # The engine and the Tauri app. macOS because the app is macOS-only (its
  # output window is an NSScreen), and because the runner has Metal, so the
  # engine's GPU render tests draw rather than skip.
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # The app's tauri.conf.json points at dist-app/, which has to exist for
      # the app crate to compile.
      - run: npm ci
      - run: npm run app:build-ui

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci

      - run: cargo test -p visuals-engine --lib

      # rusty_link builds Ableton Link with cmake, which the macOS image has.
      - run: cargo test -p visuals-app
