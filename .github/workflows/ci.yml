name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # The editor page's tests, with coverage: same tests, V8's own counters,
      # and a table in the log instead of a number that only ever existed in
      # somebody's terminal.
      - id: coverage
        run: npm run test:coverage

      - if: ${{ !cancelled() && steps.coverage.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      # The "must build from a clean tree" rule, enforced rather than
      # remembered. A clean checkout is the only place it's honestly tested —
      # a file that's untracked but imported passes locally and fails here.
      - run: npm run app:build-ui

  # The engine and the Tauri app. macOS because the app is macOS-only (its
  # output window is an NSScreen), and because the runner has Metal, so the
  # engine's GPU render tests draw rather than skip.
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # The app's tauri.conf.json points at dist-app/, which has to exist for
      # the app crate to compile.
      - run: npm ci
      - run: npm run app:build-ui

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci

      - run: cargo test -p visuals-engine --lib

      # `--lib` never compiles the engine's bins, so this is what catches a broken one.
      - run: cargo build -p visuals-engine --bins

      # rusty_link builds Ableton Link with cmake, which the macOS image has.
      - run: cargo test -p visuals-app
