name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # .prettierrc.json sets the house style; `npx prettier --write app/src` fixes a failure.
      - run: npm run format:check

      - run: npm run typecheck

      # The editor page's tests, with coverage: same tests, V8's own counters,
      # and a table in the log instead of a number that only ever existed in
      # somebody's terminal.
      - id: coverage
        run: npm run test:coverage

      - if: ${{ !cancelled() && steps.coverage.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      # The "must build from a clean tree" rule, enforced rather than
      # remembered. A clean checkout is the only place it's honestly tested —
      # a file that's untracked but imported passes locally and fails here.
      # The lab page (with the editor) first, then the app's, which must have
      # none of the editor in it: no Lab chunk, no editor-only command.
      - run: npm run app:build-ui:lab
      - run: npm run app:build-ui
      - name: No editor in the app's page
        run: |
          if ls dist-app/assets | grep -q '^Lab-' || grep -qE "[\"'\`](apply|set_value|previews|default_shader)[\"'\`]" dist-app/assets/*.js; then
            echo "the editor's code is in the app's page (dist-app/)"
            exit 1
          fi
      # Nor any of `npm run dev`'s bridge (`app/src/dev/`).
      - run: npm run check:no-dev-code

  # The engine and the Tauri app. macOS because the app is macOS-only (its
  # output window is an NSScreen), and because the runner has Metal, so the
  # engine's GPU render tests draw rather than skip.
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # The app's tauri.conf.json points at dist-app/, which has to exist for
      # the app crate to compile.
      - run: npm ci
      - run: npm run app:build-ui

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # rustfmt.toml sets the house style; `cargo fmt --all` fixes a failure.
      - run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci

      - run: cargo test -p visuals-engine --lib

      # `--lib` never compiles the engine's bins, so this builds them all and runs their tests.
      - run: cargo test -p visuals-engine --bins

      # rusty_link builds Ableton Link with cmake, which the macOS image has.
      # With `dev-bridge`, so `npm run dev`'s bridge is tested too; the rest is the same.
      - run: cargo test -p visuals-app --features dev-bridge

      # The app as it ships, without the bridge: none of it may be in the binary.
      - run: cargo build -p visuals-app
      - run: node app/no-dev-code.mjs --bin target/debug/visuals

      # The lab build (the editor's commands) compiles too, as `npm run dev:lab` builds it; its tests are the same.
      - run: cargo build -p visuals-app --features lab,dev-bridge

      # The compare bench's engine half; its GPU tests draw here (Metal) and skip without a GPU.
      - run: cargo test -p visuals-compare

  # The compare bench's TypeScript: its metric, its approvals and its HLSL
  # repairs. compare/ is its own package; neither the root typecheck nor the
  # root tests reach it, and none of this needs a Playwright browser.
  compare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compare
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: compare/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
