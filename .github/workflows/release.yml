# The signed, notarised macOS build of the Tauri app (`app/`).
#
# - A `v*` tag builds it and opens a draft release with the disk image.
# - Running it by hand (Actions → release → Run workflow, on any branch) builds
#   the same signed image and keeps it as a build artifact, with no release —
#   for trying a build on another Mac before anything is tagged.
# - Every day, if `main` has moved since the last one, it builds the nightly:
#   the same signed image, put on the `nightly` prerelease in place of the one
#   before, so its link never changes:
#   https://github.com/openflowfm/visuals/releases/download/nightly/visual-flow-nightly_aarch64.dmg
#   Running it by hand on `main` with "nightly" ticked builds one now, moved
#   or not.
#
# Every build's CFBundleVersion is the run number, so About and crash reports
# say which build it was; the run page names the commit.
#
# It needs these repository secrets, the same names the other openflowfm apps
# use:
#   MACOS_CERTIFICATE           the Developer ID Application certificate and
#                               its key, exported as .p12, base64
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_API_KEY_P8            an App Store Connect API key (.p8), base64
#   APPLE_API_KEY_ID            that key's ID
#   APPLE_API_ISSUER            its issuer ID
#
# Updates (`app/src-tauri/src/updater.rs`): with these two set as well, every
# build also makes the signed update bundle (`*.app.tar.gz`, its `.sig`) and
# `latest.json`, the file the app reads to learn of a newer version. A tagged
# release carries them for the stable channel (live once the draft is
# published); the nightly carries them for the nightly channel.
#   TAURI_SIGNING_PRIVATE_KEY           the updater's private key, from
#                                       `cargo tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# Without them the build goes on without update bundles or `latest.json` and
# says so; the app then says "Updates aren't set up in this build" if asked.
# With them, `plugins.updater.pubkey` in tauri.conf.json must hold the matching
# public key; the guard checks only that it isn't still the placeholder.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish it as the nightly (main only)
        type: boolean
        default: false
  # 06:00 UTC: after a European evening and an American one.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The runner image is pinned rather than `-latest`. `-latest` migrates to a new
# OS over a month or two with nothing here changing, which is fine for `ci.yml`
# and wrong for the job that signs a release — the tag would build on a
# different macOS than the one it was tried on. `macos-26` is where
# `macos-latest` currently points, and it is Apple Silicon, so the build is
# aarch64 only.

jobs:
  # The tag and the manifest have to agree before anything is built, because
  # nothing downstream checks. Tauri names the disk image and stamps the bundle
  # with tauri.conf.json's own version, so a `v0.2.0` tag on a tree that still
  # says 0.1.0 produces a `v0.2.0` release of a `0.1.0` app, signed and
  # notarised and wrong.
  #
  # Its own job rather than a step, so it fails in fifteen seconds instead of
  # twenty minutes into a build.
  guard:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      nightly: ${{ steps.plan.outputs.nightly }}
      dmg: ${{ steps.plan.outputs.dmg }}
      version: ${{ steps.plan.outputs.version }}
      bundle: ${{ steps.plan.outputs.bundle }}
      updates: ${{ steps.updates.outputs.updates }}
    steps:
      - uses: actions/checkout@v7

      # What this run makes: a release, a nightly, or a build to download from
      # the run page. A scheduled nightly with nothing new on main since the
      # last one builds nothing — the same image twice is twenty minutes of a
      # Mac for no one.
      - name: What this run builds
        id: plan
        env:
          NIGHTLY_INPUT: ${{ inputs.nightly }}
        run: |
          set -eu
          nightly=false
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$NIGHTLY_INPUT" = true ]; then
            nightly=true
          fi
          if [ "$nightly" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::the nightly is built from main, not $GITHUB_REF_NAME."
            exit 1
          fi
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            last=$(git ls-remote origin refs/tags/nightly | cut -f1)
            if [ "$last" = "$GITHUB_SHA" ]; then
              echo "main is still ${GITHUB_SHA:0:7}, the last nightly; nothing to build."
              build=false
            fi
          fi
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          # The nightly's update bundle carries its build number, so the one
          # `latest.json` points at is never replaced under it mid-download.
          if [ "$nightly" = true ]; then
            dmg=visual-flow-nightly_aarch64.dmg
            bundle="visual-flow-nightly-${GITHUB_RUN_NUMBER}_aarch64.app.tar.gz"
          else
            dmg="visual-flow_${version}_aarch64.dmg"
            bundle="visual-flow_${version}_aarch64.app.tar.gz"
          fi
          {
            echo "build=$build"
            echo "nightly=$nightly"
            echo "dmg=$dmg"
            echo "version=$version"
            echo "bundle=$bundle"
          } >> "$GITHUB_OUTPUT"

      # Update bundles need the updater's private key. Without it this is a
      # build without updates, said plainly; with it, the config must hold the
      # public key that matches, or every update would fail its signature check
      # on the user's Mac. This step checks only that it isn't the placeholder.
      - name: Whether this build makes updates
        id: updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set: building without update bundles or latest.json. The app will say updates aren't set up."
            echo "updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pubkey=$(node -p "require('./app/src-tauri/tauri.conf.json').plugins.updater.pubkey")
          case "$pubkey" in
            ''|REPLACE_WITH*)
              echo "::error file=app/src-tauri/tauri.conf.json::TAURI_SIGNING_PRIVATE_KEY is set but plugins.updater.pubkey is still the placeholder; put the public key there."
              exit 1
              ;;
          esac
          echo "update bundles will be signed and latest.json published"
          echo "updates=true" >> "$GITHUB_OUTPUT"

      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          found=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$found" != "$tag" ]; then
            echo "::error file=app/src-tauri/tauri.conf.json::tag says $tag, tauri.conf.json says $found."
            exit 1
          fi
          echo "tag and tauri.conf.json agree on $tag"

      # Without the secrets Tauri builds an unsigned app and says nothing, so
      # their absence is an error here rather than a surprise at the end.
      - name: The signing secrets are set
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          missing=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::the $name secret is not set on this repository."
              missing=1
            fi
          done
          exit "$missing"

  app:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # The same tauri-cli as the one the app is built with locally. rusty_link
      # builds Ableton Link with cmake, which the macOS image already has.
      - run: cargo install tauri-cli --version 2.9.6 --locked

      # The certificate goes into a keychain made for this run, which goes away
      # with the runner. Tauri signs the app with the identity found in it, and
      # the disk image is signed with the same identity further down.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # notarytool wants the App Store Connect key as a file on disk and a
      # secret is a string, so it lands under RUNNER_TEMP too.
      - name: Write the notary key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -eu
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      # Tauri signs the app with APPLE_SIGNING_IDENTITY (hardened runtime,
      # Entitlements.plist) and, given APPLE_API_*, notarises and staples it
      # before wrapping it in the disk image. `targets` in tauri.conf.json stays
      # `app` so local builds don't make an image; the release asks for both.
      #
      # With the updater's key it also makes the update bundle (the notarised
      # app, tarred and signed with that key). VISUALS_CHANNEL and VISUALS_BUILD
      # are compiled in: which `latest.json` the app reads, and which nightly
      # it is.
      - name: Build the app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATES: ${{ needs.guard.outputs.updates }}
          VISUALS_CHANNEL: ${{ needs.guard.outputs.nightly == 'true' && 'nightly' || 'stable' }}
        working-directory: app/src-tauri
        run: |
          set -eu
          export VISUALS_BUILD="$GITHUB_RUN_NUMBER"
          updater=false
          if [ "$UPDATES" = true ]; then
            updater=true
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          cargo tauri build --bundles app,dmg \
            --config "{\"bundle\":{\"createUpdaterArtifacts\":$updater,\"macOS\":{\"bundleVersion\":\"$GITHUB_RUN_NUMBER\"}}}"

      # The image is the file that travels, and Gatekeeper assesses it on open
      # — an un-notarised one is refused with "Apple cannot check it for
      # malicious software" no matter how good the app inside is. So it is
      # signed, submitted and stapled here, under a name without the brackets
      # (GitHub rewrites them in asset names).
      - name: Sign and notarise the disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DMG: ${{ needs.guard.outputs.dmg }}
        run: |
          set -eux
          mkdir release
          dmgs=(target/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="release/$DMG"
          cp "${dmgs[0]}" "$dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      # A green build step proves little: the check that counts is what the
      # receiving Mac asks. `spctl` is Gatekeeper itself, and it rejects
      # anything signed but never notarised — the exact failure this workflow
      # exists to avoid.
      - name: Verify what a stranger's Mac will see
        run: |
          set -eux
          for app in target/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done
          for dmg in release/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            xcrun stapler validate "$dmg"
          done

      # The update bundle Tauri made from the notarised app, renamed without
      # the brackets, and the `latest.json` that points at it where this run
      # puts it: the tag's release, or the nightly. A version on the nightly
      # says its build (`0.3.0-nightly.123`), which is how a nightly knows a
      # later one (`updater.rs`). A run by hand on a branch makes them for a
      # look at the run page, pointing where the tag of this version would.
      - name: The update bundle and latest.json
        if: needs.guard.outputs.updates == 'true'
        env:
          NIGHTLY: ${{ needs.guard.outputs.nightly }}
          VERSION: ${{ needs.guard.outputs.version }}
          BUNDLE: ${{ needs.guard.outputs.bundle }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eux
          bundles=(target/release/bundle/macos/*.app.tar.gz)
          test "${#bundles[@]}" -eq 1
          cp "${bundles[0]}" "release/$BUNDLE"
          cp "${bundles[0]}.sig" "release/$BUNDLE.sig"
          if [ "$NIGHTLY" = true ]; then
            version="${VERSION%%-*}-nightly.${GITHUB_RUN_NUMBER}"
            url="$REPO_URL/releases/download/nightly/$BUNDLE"
            notes="Nightly build ${GITHUB_RUN_NUMBER}, from ${GITHUB_SHA:0:7} on main. Not a release, and not tested beyond building."
          else
            version="$VERSION"
            tag="v$VERSION"
            url="$REPO_URL/releases/download/$tag/$BUNDLE"
            if [ -f ".github/notes/$tag.md" ]; then
              notes=$(cat ".github/notes/$tag.md")
            else
              notes="What's new in $tag: $REPO_URL/releases/tag/$tag"
            fi
          fi
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$url" \
            --rawfile signature "release/$BUNDLE.sig" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > release/latest.json
          cat release/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: visual-flow
          path: release/*
          if-no-files-found: error

  publish:
    needs: app
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      # A draft, always. Release notes get one last human read, and a
      # published release is what every install instruction points at.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          notes=".github/notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(find assets -type f | sort)
          test "${#files[@]}" -gt 0
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            "${prerelease[@]}" "${notes_args[@]}" "${files[@]}"

  # One prerelease, `nightly`, whose image is replaced each time, so the link
  # in the header never changes. It is never "latest": the latest release is
  # what a tagged version is for. The tag moves only after the new image is
  # up, so a failed upload leaves the old image and the old tag, and the next
  # night tries again rather than thinking it is done.
  nightly:
    needs: [guard, app]
    if: needs.guard.outputs.nightly == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Replace the nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DMG: ${{ needs.guard.outputs.dmg }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eux
          test -f "assets/$DMG"
          title="Nightly ${GITHUB_SHA:0:7}"
          notes="Built from ${GITHUB_SHA} on $(date -u +%F) — build ${GITHUB_RUN_NUMBER}, ${RUN_URL}.
          Signed and notarised, straight from main: not a release, and not tested beyond building."
          if ! gh release view nightly > /dev/null 2>&1; then
            if ! gh api "repos/$GH_REPO/git/refs/tags/nightly" > /dev/null 2>&1; then
              gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA"
            fi
            gh release create nightly --verify-tag --prerelease --latest=false \
              --title "$title" --notes "$notes"
          fi
          gh release upload nightly "assets/$DMG" --clobber
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
          gh release edit nightly --prerelease --latest=false --title "$title" --notes "$notes"

      # The update bundle goes up before the `latest.json` that names it, so
      # the app never reads of a bundle that isn't there yet. The bundle the
      # new `latest.json` names and the two nightlies' before it stay, so a Mac
      # that read an earlier `latest.json` can still download what it names;
      # older ones go. A re-run of an older run (a lower run number than the
      # live `latest.json`'s) publishes nothing, so the nightly never rolls back.
      - name: Publish the nightly's update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATES: ${{ needs.guard.outputs.updates }}
          BUNDLE: ${{ needs.guard.outputs.bundle }}
        run: |
          set -eux
          if [ "$UPDATES" != true ]; then
            echo "No updater key: the nightly has no update bundle or latest.json this time."
            exit 0
          fi
          live=0
          if gh release download nightly --pattern latest.json --output live-latest.json --clobber; then
            live=$(jq -r '.version' live-latest.json | sed -n 's/.*-nightly\.\([0-9][0-9]*\)$/\1/p')
            live=${live:-0}
          fi
          if [ "$GITHUB_RUN_NUMBER" -lt "$live" ]; then
            echo "::notice::The live nightly latest.json is build $live, newer than this run ($GITHUB_RUN_NUMBER): not publishing this update."
            exit 0
          fi
          gh release upload nightly "assets/$BUNDLE" "assets/$BUNDLE.sig" --clobber
          gh release upload nightly assets/latest.json --clobber
          names=$(gh release view nightly --json assets --jq '.assets[].name')
          # The run numbers of the three newest nightly bundles (this one among them).
          keep=$(printf '%s\n' "$names" | sed -n 's/^visual-flow-nightly-\([0-9][0-9]*\)_aarch64\.app\.tar\.gz$/\1/p' | sort -rn | head -n 3)
          printf '%s\n' "$names" | while IFS= read -r name; do
            case "$name" in
              "$BUNDLE"|"$BUNDLE.sig") ;;
              visual-flow-nightly-*_aarch64.app.tar.gz|visual-flow-nightly-*_aarch64.app.tar.gz.sig)
                run=${name#visual-flow-nightly-}
                run=${run%%_*}
                if ! printf '%s\n' "$keep" | grep -qx "$run"; then
                  gh release delete-asset nightly "$name" --yes
                fi ;;
            esac
          done
