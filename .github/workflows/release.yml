# The signed, notarised macOS build of the Tauri app (`app/`), for the three
# update channels (`docs/releasing.md` says how a release goes out):
#
# - latest: every push to `main` builds it and puts it on the `latest`
#   prerelease in place of the one before, so its link never changes:
#   https://github.com/openflowfm/visuals/releases/download/latest/visual-flow-latest_aarch64.dmg
#   A newer push cancels a build still running, so the last push always gets
#   one.
# - beta: a `vX.Y.Z-rc.N` tag builds a beta app and opens a draft prerelease
#   for the tag. Publishing the draft (by hand) puts its image and its
#   `latest.json` on the fixed `beta` prerelease:
#   https://github.com/openflowfm/visuals/releases/download/beta/visual-flow-beta_aarch64.dmg
# - stable: a `vX.Y.Z` tag builds a stable app and opens a draft release.
#   Publishing it makes it the latest release, which stable apps read, and
#   puts its `latest.json` on the `beta` prerelease too, so beta testers roll
#   onto the final.
# - Running it by hand (Actions → release → Run workflow, on any branch) builds
#   the same signed image and keeps it as a build artifact, with no release —
#   for trying a build on another Mac before anything is tagged.
#
# Tag builds are never cancelled. Every build's CFBundleVersion is the run
# number, so About and crash reports say which build it was; the run page
# names the commit.
#
# It needs these repository secrets, the same names the other openflowfm apps
# use:
#   MACOS_CERTIFICATE           the Developer ID Application certificate and
#                               its key, exported as .p12, base64
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_API_KEY_P8            an App Store Connect API key (.p8), base64
#   APPLE_API_KEY_ID            that key's ID
#   APPLE_API_ISSUER            its issuer ID
#
# Updates (`app/src-tauri/src/updater.rs`): with these two set as well, every
# build also makes the signed update bundle (`*.app.tar.gz`, its `.sig`) and
# `latest.json`, the file the app reads to learn of a newer version. A tag's
# release carries them (live once the draft is published, which also copies
# its `latest.json` to `beta`); the `latest` prerelease carries the latest
# channel's.
#   TAURI_SIGNING_PRIVATE_KEY           the updater's private key, from
#                                       `cargo tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# Without them the build goes on without update bundles or `latest.json` and
# says so; the app then says "Updates aren't set up in this build" if asked.
# With them, `plugins.updater.pubkey` in tauri.conf.json must hold the matching
# public key; the guard checks only that it isn't still the placeholder.

name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # Publishing a tag's draft (by hand) feeds the `beta` prerelease.
  release:
    types: [published]

permissions:
  contents: write

# The runner image is pinned rather than `-latest`. `-latest` migrates to a new
# OS over a month or two with nothing here changing, which is fine for `ci.yml`
# and wrong for the job that signs a release — the tag would build on a
# different macOS than the one it was tried on. `macos-26` is where
# `macos-latest` currently points, and it is Apple Silicon, so the build is
# aarch64 only.

jobs:
  # The tag and the manifest have to agree before anything is built, because
  # nothing downstream checks. Tauri names the disk image and stamps the bundle
  # with tauri.conf.json's own version, so a `v0.2.0` tag on a tree that still
  # says 0.1.0 produces a `v0.2.0` release of a `0.1.0` app, signed and
  # notarised and wrong.
  #
  # Its own job rather than a step, so it fails in fifteen seconds instead of
  # twenty minutes into a build.
  guard:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      channel: ${{ steps.plan.outputs.channel }}
      dmg: ${{ steps.plan.outputs.dmg }}
      version: ${{ steps.plan.outputs.version }}
      bundle: ${{ steps.plan.outputs.bundle }}
      updates: ${{ steps.updates.outputs.updates }}
    steps:
      - uses: actions/checkout@v7

      # What this run makes: a latest build (a push to main), a release
      # candidate or a final (a tag), or a build to download from the run page
      # (by hand, on any branch or tag).
      - name: What this run builds
        id: plan
        run: |
          set -eu
          kind=manual
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              refs/heads/main) kind=latest ;;
              refs/tags/*)
                if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
                  kind=rc
                elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  kind=final
                else
                  echo "::error::$GITHUB_REF_NAME is neither a release (vX.Y.Z) nor a release candidate (vX.Y.Z-rc.N)."
                  exit 1
                fi ;;
              *)
                echo "::error::release.yml doesn't build pushes to $GITHUB_REF."
                exit 1 ;;
            esac
          fi
          case "$kind" in
            latest) channel=latest ;;
            rc) channel=beta ;;
            *) channel=stable ;;
          esac
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          # A latest build's update bundle carries its build number, so the
          # one `latest.json` points at is never replaced under it
          # mid-download.
          if [ "$kind" = latest ]; then
            dmg=visual-flow-latest_aarch64.dmg
            bundle="visual-flow-latest-${GITHUB_RUN_NUMBER}_aarch64.app.tar.gz"
          else
            dmg="visual-flow_${version}_aarch64.dmg"
            bundle="visual-flow_${version}_aarch64.app.tar.gz"
          fi
          echo "this run builds: $kind, for the $channel channel"
          {
            echo "kind=$kind"
            echo "channel=$channel"
            echo "dmg=$dmg"
            echo "version=$version"
            echo "bundle=$bundle"
          } >> "$GITHUB_OUTPUT"

      # Update bundles need the updater's private key. Without it this is a
      # build without updates, said plainly; with it, the config must hold the
      # public key that matches, or every update would fail its signature check
      # on the user's Mac. This step checks only that it isn't the placeholder.
      - name: Whether this build makes updates
        id: updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set: building without update bundles or latest.json. The app will say updates aren't set up."
            echo "updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pubkey=$(node -p "require('./app/src-tauri/tauri.conf.json').plugins.updater.pubkey")
          case "$pubkey" in
            ''|REPLACE_WITH*)
              echo "::error file=app/src-tauri/tauri.conf.json::TAURI_SIGNING_PRIVATE_KEY is set but plugins.updater.pubkey is still the placeholder; put the public key there."
              exit 1
              ;;
          esac
          echo "update bundles will be signed and latest.json published"
          echo "updates=true" >> "$GITHUB_OUTPUT"

      - name: The tag is the version
        if: steps.plan.outputs.kind == 'rc' || steps.plan.outputs.kind == 'final'
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          found=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$found" != "$tag" ]; then
            echo "::error file=app/src-tauri/tauri.conf.json::tag says $tag, tauri.conf.json says $found."
            exit 1
          fi
          echo "tag and tauri.conf.json agree on $tag"

      # Without the secrets Tauri builds an unsigned app and says nothing, so
      # their absence is an error here rather than a surprise at the end.
      - name: The signing secrets are set
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          missing=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::the $name secret is not set on this repository."
              missing=1
            fi
          done
          exit "$missing"

  app:
    needs: guard
    runs-on: macos-26
    # A push to main cancels the latest build still running from an earlier
    # push (and one still waiting), so the last push always gets a build.
    # Every other run, tags above all, has a group of its own and is never
    # cancelled.
    concurrency:
      group: ${{ needs.guard.outputs.kind == 'latest' && 'release-latest-build' || format('release-build-{0}', github.run_id) }}
      cancel-in-progress: ${{ needs.guard.outputs.kind == 'latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # The same tauri-cli as the one the app is built with locally. rusty_link
      # builds Ableton Link with cmake, which the macOS image already has.
      - run: cargo install tauri-cli --version 2.9.6 --locked

      # The certificate goes into a keychain made for this run, which goes away
      # with the runner. Tauri signs the app with the identity found in it, and
      # the disk image is signed with the same identity further down.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # notarytool wants the App Store Connect key as a file on disk and a
      # secret is a string, so it lands under RUNNER_TEMP too.
      - name: Write the notary key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -eu
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      # Tauri signs the app with APPLE_SIGNING_IDENTITY (hardened runtime,
      # Entitlements.plist) and, given APPLE_API_*, notarises and staples it
      # before wrapping it in the disk image. `targets` in tauri.conf.json stays
      # `app` so local builds don't make an image; the release asks for both.
      #
      # With the updater's key it also makes the update bundle (the notarised
      # app, tarred and signed with that key). VISUALS_CHANNEL and VISUALS_BUILD
      # are compiled in: which `latest.json` the app reads, and which build it
      # is.
      - name: Build the app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATES: ${{ needs.guard.outputs.updates }}
          VISUALS_CHANNEL: ${{ needs.guard.outputs.channel }}
        working-directory: app/src-tauri
        run: |
          set -eu
          export VISUALS_BUILD="$GITHUB_RUN_NUMBER"
          updater=false
          if [ "$UPDATES" = true ]; then
            updater=true
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          cargo tauri build --bundles app,dmg \
            --config "{\"bundle\":{\"createUpdaterArtifacts\":$updater,\"macOS\":{\"bundleVersion\":\"$GITHUB_RUN_NUMBER\"}}}"

      # The image is the file that travels, and Gatekeeper assesses it on open
      # — an un-notarised one is refused with "Apple cannot check it for
      # malicious software" no matter how good the app inside is. So it is
      # signed, submitted and stapled here, under a name without the brackets
      # (GitHub rewrites them in asset names).
      - name: Sign and notarise the disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DMG: ${{ needs.guard.outputs.dmg }}
        run: |
          set -eux
          mkdir release
          dmgs=(target/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="release/$DMG"
          cp "${dmgs[0]}" "$dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      # A green build step proves little: the check that counts is what the
      # receiving Mac asks. `spctl` is Gatekeeper itself, and it rejects
      # anything signed but never notarised — the exact failure this workflow
      # exists to avoid.
      - name: Verify what a stranger's Mac will see
        run: |
          set -eux
          for app in target/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done
          for dmg in release/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            xcrun stapler validate "$dmg"
          done

      # The update bundle Tauri made from the notarised app, renamed without
      # the brackets, and the `latest.json` that points at it where this run
      # puts it: the tag's release, or the `latest` prerelease. A latest
      # build's version says its build (`0.3.0-latest.123`), which is how one
      # knows a later one (`updater.rs`). A run by hand makes them for a look
      # at the run page, pointing where the tag of this version would.
      - name: The update bundle and latest.json
        if: needs.guard.outputs.updates == 'true'
        env:
          KIND: ${{ needs.guard.outputs.kind }}
          VERSION: ${{ needs.guard.outputs.version }}
          BUNDLE: ${{ needs.guard.outputs.bundle }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eux
          bundles=(target/release/bundle/macos/*.app.tar.gz)
          test "${#bundles[@]}" -eq 1
          cp "${bundles[0]}" "release/$BUNDLE"
          cp "${bundles[0]}.sig" "release/$BUNDLE.sig"
          if [ "$KIND" = latest ]; then
            version="${VERSION%%-*}-latest.${GITHUB_RUN_NUMBER}"
            url="$REPO_URL/releases/download/latest/$BUNDLE"
            notes="Latest build ${GITHUB_RUN_NUMBER}, from ${GITHUB_SHA:0:7} on main. Not a release, and not tested beyond building."
          else
            version="$VERSION"
            tag="v$VERSION"
            url="$REPO_URL/releases/download/$tag/$BUNDLE"
            if [ -f ".github/notes/$tag.md" ]; then
              notes=$(cat ".github/notes/$tag.md")
            else
              notes="What's new in $tag: $REPO_URL/releases/tag/$tag"
            fi
          fi
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$url" \
            --rawfile signature "release/$BUNDLE.sig" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > release/latest.json
          cat release/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: visual-flow
          path: release/*
          if-no-files-found: error

  # A tag's release: a draft, always, a prerelease for a release candidate.
  # Release notes get one last human read, and publishing it is what lets it
  # out: a final becomes the latest release (the stable channel and every
  # install instruction), and the `beta` job below feeds either to beta.
  publish:
    needs: [guard, app]
    if: needs.guard.outputs.kind == 'rc' || needs.guard.outputs.kind == 'final'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Open the draft
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.guard.outputs.kind }}
        run: |
          set -eux
          notes=".github/notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(find assets -type f | sort)
          test "${#files[@]}" -gt 0
          prerelease=()
          if [ "$KIND" = rc ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            "${prerelease[@]}" "${notes_args[@]}" "${files[@]}"

  # One prerelease, `latest`, whose image is replaced each time, so its link
  # never changes. It is never GitHub's "latest release": that is what a final
  # is for. The tag moves only after the new image is up, so a failed upload
  # leaves the old image and the old tag. Publishing waits for a publish
  # still running rather than cancelling it halfway.
  latest:
    needs: [guard, app]
    if: needs.guard.outputs.kind == 'latest'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-latest-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Replace the latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DMG: ${{ needs.guard.outputs.dmg }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eux
          test -f "assets/$DMG"
          title="Latest ${GITHUB_SHA:0:7}"
          notes="Built from ${GITHUB_SHA} on $(date -u +%F) — build ${GITHUB_RUN_NUMBER}, ${RUN_URL}.
          Signed and notarised, straight from main: not a release, and not tested beyond building."
          if ! gh release view latest > /dev/null 2>&1; then
            if ! gh api "repos/$GH_REPO/git/refs/tags/latest" > /dev/null 2>&1; then
              gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
            fi
            gh release create latest --verify-tag --prerelease --latest=false \
              --title "$title" --notes "$notes"
          fi
          # A build that a later one has already replaced leaves it be.
          live=$(gh release view latest --json name --jq .name | sed -n 's/^Latest build \([0-9][0-9]*\) .*/\1/p')
          if [ -n "$live" ] && [ "$GITHUB_RUN_NUMBER" -lt "$live" ]; then
            echo "::notice::The latest prerelease already has build $live, newer than this run ($GITHUB_RUN_NUMBER): leaving it."
            exit 0
          fi
          title="Latest build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})"
          gh release upload latest "assets/$DMG" --clobber
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
          gh release edit latest --prerelease --latest=false --title "$title" --notes "$notes"

      # The update bundle goes up before the `latest.json` that names it, so
      # the app never reads of a bundle that isn't there yet. The bundle the
      # new `latest.json` names and the two before it stay, so a Mac that read
      # an earlier `latest.json` can still download what it names; older ones
      # go. A run older than the live `latest.json`'s build publishes nothing,
      # so the channel never rolls back.
      - name: Publish the latest build's update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATES: ${{ needs.guard.outputs.updates }}
          BUNDLE: ${{ needs.guard.outputs.bundle }}
        run: |
          set -eux
          if [ "$UPDATES" != true ]; then
            echo "No updater key: the latest build has no update bundle or latest.json this time."
            exit 0
          fi
          live=0
          if gh release download latest --pattern latest.json --output live-latest.json --clobber; then
            live=$(jq -r '.version' live-latest.json | sed -n 's/.*-latest\.\([0-9][0-9]*\)$/\1/p')
            live=${live:-0}
          fi
          if [ "$GITHUB_RUN_NUMBER" -lt "$live" ]; then
            echo "::notice::The live latest.json is build $live, newer than this run ($GITHUB_RUN_NUMBER): not publishing this update."
            exit 0
          fi
          gh release upload latest "assets/$BUNDLE" "assets/$BUNDLE.sig" --clobber
          gh release upload latest assets/latest.json --clobber
          names=$(gh release view latest --json assets --jq '.assets[].name')
          # The run numbers of the three newest bundles (this one among them).
          keep=$(printf '%s\n' "$names" | sed -n 's/^visual-flow-latest-\([0-9][0-9]*\)_aarch64\.app\.tar\.gz$/\1/p' | sort -rn | head -n 3)
          printf '%s\n' "$names" | while IFS= read -r name; do
            case "$name" in
              "$BUNDLE"|"$BUNDLE.sig") ;;
              visual-flow-latest-*_aarch64.app.tar.gz|visual-flow-latest-*_aarch64.app.tar.gz.sig)
                run=${name#visual-flow-latest-}
                run=${run%%_*}
                if ! printf '%s\n' "$keep" | grep -qx "$run"; then
                  gh release delete-asset latest "$name" --yes
                fi ;;
            esac
          done

  # The beta channel: one prerelease, `beta`, fed when a tag's draft is
  # published by hand. A release candidate brings its image (renamed, so the
  # link never changes) and its `latest.json`; a final brings only its
  # `latest.json`, so testers roll onto it while the beta image stays a beta
  # app. Its `latest.json` names the bundle on the tag's own release, which
  # downloads only once that release is published, hence feeding on publish
  # rather than on the build. The feed never goes back: a tag older than the
  # one it holds (a patch to an older release, published after the next
  # one's candidate) leaves it be.
  beta:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-beta-publish
      cancel-in-progress: false
    steps:
      - name: Feed the beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -eux
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::notice::$TAG is neither a release nor a release candidate: the beta is left as it is."
            exit 0
          fi
          version="${TAG#v}"
          # A version as numbers that sort: X Y Z, then the candidate, a final
          # coming after every candidate of its version.
          key() {
            local core=${1%%-*} rc=999999
            if [[ "$1" == *-rc.* ]]; then rc=${1##*-rc.}; fi
            printf '%s %s\n' "${core//./ }" "$rc"
          }
          if ! gh release view beta > /dev/null 2>&1; then
            if ! gh api "repos/$GH_REPO/git/refs/tags/beta" > /dev/null 2>&1; then
              gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/beta -f sha="$GITHUB_SHA"
            fi
            gh release create beta --verify-tag --prerelease --latest=false \
              --title "Beta" --notes "Release candidates of visual[flow], and each release."
          fi
          # The version the beta holds, from its title ("Beta 1.0.0-rc.2").
          live=$(gh release view beta --json name --jq .name | sed -n 's/^Beta \([0-9][0-9.]*\(-rc\.[0-9][0-9]*\)\{0,1\}\)$/\1/p')
          if [ -n "$live" ]; then
            if [ "$live" = "$version" ] || [ "$(printf '%s\n%s\n' "$(key "$live")" "$(key "$version")" | sort -k1,1n -k2,2n -k3,3n -k4,4n | tail -n 1)" != "$(key "$version")" ]; then
              echo "::notice::The beta already holds $live, not older than $version: leaving it."
              exit 0
            fi
          fi
          mkdir new
          if [[ "$TAG" == *-rc.* ]]; then
            gh release download "$TAG" --pattern "visual-flow_${version}_aarch64.dmg" --output new/visual-flow-beta_aarch64.dmg
            gh release upload beta new/visual-flow-beta_aarch64.dmg --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/beta" -f sha="$GITHUB_SHA" -F force=true
          fi
          if gh release download "$TAG" --pattern latest.json --output new/latest.json; then
            gh release upload beta new/latest.json --clobber
          else
            echo "::notice::$TAG has no latest.json (built without the updater's key): beta apps won't hear of it."
          fi
          gh release edit beta --prerelease --latest=false --title "Beta $version" \
            --notes "Release candidates of visual[flow], and each release. Now: $TAG, $RELEASE_URL."
