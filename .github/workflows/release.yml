# Nothing has been released yet. This workflow is modelled on
# better-session-view's macOS pack job and stays dormant — it does nothing
# until the first `v*` tag is pushed here, and it needs the same signing
# secrets (MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, APPLE_API_KEY_P8,
# APPLE_API_KEY_ID, APPLE_API_ISSUER) added to this repo before that tag means
# anything.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# The runner image is pinned rather than `-latest`. `-latest` migrates to a new
# OS over a month or two with nothing here changing, which is fine for `ci.yml`
# and wrong for the job that signs a release — the tag would build on a
# different macOS than the one it was tried on. `macos-26` is where
# `macos-latest` currently points.

jobs:
  # The tag and the manifest have to agree before anything is built, because
  # nothing downstream checks. electron-builder names the .dmg after
  # package.json's own version, so a `v0.2.0` tag on a tree that still says
  # 0.1.0 produces a `v0.2.0` release full of `0.1.0` files, signed and
  # notarised and wrong.
  #
  # Its own job rather than a step, so it fails in fifteen seconds instead of
  # nine minutes into a notarisation.
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: The tag is the version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          found=$(node -p "require('./package.json').version")
          if [ "$found" != "$tag" ]; then
            echo "::error file=package.json::tag says $tag, package.json says $found."
            exit 1
          fi
          echo "tag and package.json agree on $tag"

  # The app, on the only OS that can sign it.
  apps:
    needs: guard
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # No ELECTRON_SKIP_BINARY_DOWNLOAD here — this is the job that needs the
      # actual binary. postinstall also compiles the Ableton Link addon against
      # this machine's toolchain.
      - run: npm ci

      # notarytool wants the App Store Connect key as a file on disk and a
      # secret is a string, so it lands under RUNNER_TEMP, which goes away with
      # the runner.
      - name: Write the notary key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -eu
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      # electron-builder reads every one of these itself: CSC_* to import the
      # certificate into a keychain it creates and throws away, APPLE_API_* to
      # notarise once the bundle is signed. Nothing in `electron-builder.yml`
      # switches them on — their presence is the switch.
      - name: Pack the app
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run pack

      # electron-builder notarises the `.app` and stops there, then wraps it in
      # a disk image it has only signed. The image is the file that travels,
      # and Gatekeeper assesses it on open — an un-notarised one is refused
      # with "Apple cannot check it for malicious software" no matter how good
      # the bundle inside is. So the image is submitted here, and stapled,
      # which is what makes it open without a network round trip.
      - name: Notarise the disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eux
          for dmg in release/*.dmg; do
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
          done

      # electron-builder warns and carries on when it cannot sign or cannot
      # notarise, so a green pack step proves nothing. This asks what the
      # receiving Mac asks, of both artifacts. `spctl` is the one that counts:
      # it is Gatekeeper itself, and it rejects anything signed but never
      # notarised — which is the exact failure this release exists to avoid.
      - name: Verify what a stranger's Mac will see
        run: |
          set -eux
          for app in release/mac-*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done
          for dmg in release/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            xcrun stapler validate "$dmg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: visual-flow
          path: release/*.dmg
          if-no-files-found: error

  publish:
    needs: apps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      # A draft, always. Release notes get one last human read, and a
      # published release is what every install instruction points at.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          notes=".github/notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(find assets -type f | sort)
          test "${#files[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            "${notes_args[@]}" "${files[@]}"
