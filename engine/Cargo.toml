[package]
name = "visuals-engine"
version = "0.1.0"
edition = "2024"
description = "visual[flow]'s MilkDrop engine: .milk parsing, shader translation, EEL, and a wgpu renderer."
license = "MIT"
publish = false

[lib]
name = "engine"

[dependencies]
glslang = "0.8.1"
glslang-sys = "0.8.1"
regex = "1"
wgpu = { version = "30.0.1", features = ["naga-ir"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
winit = "0.30"
cpal = "0.18"
png = "0.17"
naga = { version = "30.0.1", features = ["spv-in", "msl-out"] }
thiserror = "2"

[dev-dependencies]

[profile.dev.package."*"]
# glslang and naga run thousands of shaders in the pack-wide check; debug builds of
# them make that check minutes instead of seconds.
opt-level = 3
