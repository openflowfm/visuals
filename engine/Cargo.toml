[package]
name = "visuals-engine"
version = "0.2.0"
edition = "2024"
description = "visual[flow]'s MilkDrop engine: .milk parsing, shader translation, EEL, and a wgpu renderer."
license = "MIT"
publish = false

[lib]
name = "engine"

[dependencies]
glslang = "0.8.1"
glslang-sys = "0.8.1"
regex = "1"
wgpu = { version = "30.0.1", features = ["naga-ir"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
winit = "0.30"
cpal = "0.18"
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }
naga = { version = "30.0.1", features = ["spv-in", "msl-out"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
webp = { version = "0.3", default-features = false }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# wgpu's live resource counts (`Device::get_internal_counters`), for the leak
# test only: a dev-dependency's features stay out of the bins and the app.
wgpu = { version = "30.0.1", features = ["naga-ir", "counters"] }
