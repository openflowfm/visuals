<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>visual[flow] benchmark</title>
    <style>
      html, body { margin: 0; background: #0b0b0d; color: #ececed; overflow: hidden; }
      body { font: 13px ui-monospace, monospace; }
      #out {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1;
        height: 34px;
        box-sizing: border-box;
        padding: 9px 12px;
        background: #0b0b0dcc;
        white-space: pre;
      }
      canvas { position: fixed; top: 0; left: 0; }
    </style>
  </head>
  <body>
    <div id="out">starting…</div>
    <canvas id="stage"></canvas>
    <script type="module">
      import { run } from '/bench.ts';

      const out = document.getElementById('out');
      const canvas = document.getElementById('stage');
      // The runner reads these two off the page rather than being messaged: a
      // window that failed still has an answer, and a poll finds either one.
      run(canvas).then(
        (report) => {
          window.__bench = report;
          out.textContent = 'done';
        },
        (err) => {
          window.__benchError = String(err?.stack ?? err);
          out.textContent = String(err);
        },
      );
    </script>
  </body>
</html>
