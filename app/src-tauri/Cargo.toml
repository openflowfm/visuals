[package]
name = "visuals-app"
version = "0.2.0"
edition = "2024"
description = "visual[flow]: the MilkDrop editor, with the engine drawing the bench on Metal."
license = "MIT"
publish = false

[[bin]]
name = "visuals"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine = { package = "visuals-engine", path = "../../engine" }
tauri = { version = "2.11.6", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30.0.1"
cpal = "0.18"
pollster = "1"
raw-window-handle = "0.6"
# Ableton Link: the official SDK through its C wrapper (abl_link), built with cmake.
rusty_link = "0.4.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray", "NSDictionary", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSWindow", "NSGraphics", "NSScreen", "NSColor"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer"] }
